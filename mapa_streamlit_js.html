<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            /* ── Fuente Segoe UI igual que temperatura ── */
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        #mapContainer {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .leaflet-container {
            width: 100%;
            height: 100%;
            background: #1a1a2e !important; /* fondo oscuro mientras cargan tiles */
        }

        /* ── Panel base compartido ── */
        .map-panel {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #263238;
        }

        .map-info {
            position: fixed;
            bottom: 16px;
            right: 16px;
            padding: 10px 14px;
            font-size: 12px;
            z-index: 999;
            min-width: 130px;
        }

        .map-info strong {
            color: #263238;
            font-size: 16px;
        }

        .map-legend {
            position: fixed;
            bottom: 16px;
            left: 16px;
            padding: 12px 14px;
            font-size: 11px;
            z-index: 999;
            min-width: 200px;
            max-height: 400px;
            overflow-y: auto;
        }

        .legend-title {
            font-weight: 700;
            font-size: 12px;
            color: #263238;
            margin-bottom: 8px;
            border-bottom: 1px solid #B0BEC5;
            padding-bottom: 5px;
        }

        .legend-section {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #ECEFF1;
        }

        .legend-section-title {
            font-weight: 700;
            font-size: 10px;
            margin-bottom: 6px;
            color: #546E7A;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            gap: 8px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.15);
            flex-shrink: 0;
        }

        .legend-label {
            font-size: 11px;
            color: #263238;
            font-weight: 600;
        }

        #loadingSpinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            text-align: center;
            display: none;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #263238;
        }

        .spinner {
            border: 3px solid #ECEFF1;
            border-top: 3px solid #00838F;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 14px;
        }

        .turno-label {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
        }

        .turno-label::before {
            display: none !important;
        }

        /* ── Panel de alertas ── */
        .alert-panel {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 10px 12px;
            font-size: 11px;
            z-index: 999;
            min-width: 220px;
            max-width: 260px;
            max-height: 420px;
            overflow-y: auto;
        }

        .alert-panel-title {
            font-weight: 700;
            font-size: 12px;
            margin-bottom: 2px;
            color: #B71C1C;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .alert-panel-sub {
            font-size: 9px;
            color: #78909C;
            margin-bottom: 8px;
        }

        .alert-fundo {
            font-weight: 700;
            font-size: 11px;
            color: #263238;
            margin: 8px 0 4px;
            padding-left: 6px;
            border-left: 3px solid #E53935;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .alert-fundo-total {
            background: #E53935;
            color: white;
            border-radius: 10px;
            padding: 1px 7px;
            font-size: 10px;
        }

        .alert-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 6px;
            border-radius: 6px;
            margin: 2px 0;
            background: #FFF5F5;
        }

        .alert-row:hover {
            background: #FFEBEE;
        }

        .alert-turno {
            color: #263238;
            font-weight: 600;
            font-size: 11px;
        }

        .alert-cap {
            background: #E53935;
            color: white;
            border-radius: 10px;
            padding: 1px 8px;
            font-size: 10px;
            font-weight: 700;
        }

        .alert-bar {
            height: 3px;
            background: linear-gradient(to right, #E53935, #B71C1C);
            border-radius: 2px;
            margin: 1px 6px 3px;
        }

        /* ── Panel de capas ── */
        .layer-control-panel {
            position: fixed;
            top: 16px;
            left: 16px;
            padding: 10px 14px;
            font-size: 12px;
            z-index: 1000;
            min-width: 210px;
            user-select: none;
        }

        .layer-control-title {
            font-weight: 700;
            font-size: 12px;
            margin-bottom: 8px;
            color: #263238;
            border-bottom: 1px solid #B0BEC5;
            padding-bottom: 5px;
        }

        .layer-control-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 2px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .layer-control-item:hover {
            background: rgba(0,131,143,0.08);
        }

        .layer-control-item input[type="checkbox"] {
            width: 14px;
            height: 14px;
            cursor: pointer;
            accent-color: #00838F;
        }

        .layer-control-item label {
            cursor: pointer;
            font-size: 12px;
            color: #263238;
            font-weight: 500;
            flex: 1;
        }

        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes flotar {
            0%   { transform: translateX(-50%) translateY(0px)   rotate(-5deg); }
            50%  { transform: translateX(-50%) translateY(-6px)  rotate(5deg); }
            100% { transform: translateX(-50%) translateY(0px)   rotate(-5deg); }
        }
    </style>
</head>

<body>

    <div id="mapContainer"></div>

    <div class="layer-control-panel map-panel" id="layerControlPanel">
        <div class="layer-control-title">🗂️ Capas</div>
        <div class="layer-control-item" id="item_trampas">
            <input type="checkbox" id="chk_trampas" checked>
            <label for="chk_trampas">📍 Trampas</label>
        </div>
        <div class="layer-control-item" id="item_etiquetas">
            <input type="checkbox" id="chk_etiquetas" checked>
            <label for="chk_etiquetas">🏷️ Etiquetas (no rojas)</label>
        </div>
        <div class="layer-control-item" id="item_alertas">
            <input type="checkbox" id="chk_alertas" checked>
            <label for="chk_alertas">🔴 Panel Alertas</label>
        </div>
        <div class="layer-control-item" id="item_vectores">
            <input type="checkbox" id="chk_vectores" checked>
            <label for="chk_vectores">🧭 Vectores de Propagación</label>
        </div>
        <div class="layer-control-item" id="item_curvas" style="display:none;">
            <input type="checkbox" id="chk_curvas" checked>
            <label for="chk_curvas">➖ Curvas de Nivel</label>
        </div>
    </div>

    <div class="map-info map-panel">
        <div style="font-size:11px;color:#546E7A;margin-bottom:2px;">Registros</div>
        <div><strong id="recordCount">0</strong></div>
        <div style="font-size:10px; margin-top:4px; color:#78909C;" id="modoInfo">-</div>
    </div>

    <div class="alert-panel map-panel" id="alertPanel" style="display:none;"></div>
    <div class="map-legend map-panel" id="legendContainer"></div>

    <div id="loadingSpinner">
        <div class="spinner"></div>
        <p id="loadingText" style="font-size:13px;color:#546E7A;">Cargando mapa…</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

    <script>

        const streamlitData = window.streamlitData || {
            data: [],
            config: {},
            recordCount: 0,
            polygons: []
        };

        let map = null;
        let polygonLayer = null;
        let markerLayer = null;
        let isolineLayer = null;
        let allPolygons = [];
        let modoSoloAlertas = false;

        // ============================================================
        // CONFIGURACIÓN DE UMBRALES Y COLORES
        // ============================================================
        const UMBRALES = {
            verde: 1,
            amarillo: 2,
            naranja: 4,
            rojo: 4
        };

        const COLORES = {
            blanco:   "#FFFFFF",
            verde:    "#00C800",
            amarillo: "#FFD700",
            naranja:  "#FF8C00",
            rojo:     "#E63946"
        };

        function getColorByCapturas(valor) {
            const v = parseFloat(valor) || 0;
            if (v === 0) return COLORES.blanco;
            if (v <= 1) return COLORES.verde;
            if (v <= 2) return COLORES.amarillo;
            if (v <= 3) return COLORES.naranja;
            return COLORES.rojo;
        }

        function getCategoryLabel(valor) {
            const v = parseFloat(valor) || 0;
            if (v === 0) return "0 capturas";
            if (v <= 1) return "1 captura";
            if (v <= 2) return "2 capturas";
            if (v <= 3) return "3 capturas";
            return ">3 capturas";
        }

        // ── Colores por módulo (mismos que temperatura COLOR_FUNDO) ──
        const COLORES_MOD = [
            "#1565C0", // MOD 1 - azul
            "#6A1B9A", // MOD 2 - morado
            "#E65100", // MOD 3 - naranja
            "#B71C1C", // MOD 4 - rojo
            "#1B5E20", // MOD 5 - verde oscuro
            "#00838F", // MOD 6 - cyan (color acento temperatura)
            "#F9A825", // MOD 7 - amarillo oscuro
            "#37474F", // MOD 8 - gris azulado
        ];

        function getColorMod(mod_n) {
            if (!mod_n) return "#546E7A";
            const idx = (parseInt(mod_n) - 1) % COLORES_MOD.length;
            return COLORES_MOD[idx];
        }

        // ============================================================
        // FUNCIONES DE NORMALIZACIÓN
        // ============================================================
        function _norm_mod(val) {
            if (!val) return null;
            const s = String(val).toUpperCase().trim();
            const match = s.match(/(\d+)/);
            return match ? parseInt(match[1]) : null;
        }

        function _norm_tur(val) {
            if (!val) return null;
            const s = String(val).toUpperCase().trim();
            let match = s.match(/T[\s\-]?(\d+)/);
            if (match) { const n = parseInt(match[1]); return n <= 20 ? n : null; }
            match = s.match(/^\s*T?(\d+)\s*$/);
            if (match) { const n = parseInt(match[1]); return n <= 20 ? n : null; }
            return null;
        }

        function _norm_lote(val) {
            if (!val) return null;
            let s = String(val).trim().toUpperCase();
            if (!s || s === 'NAN' || s === 'NONE') return null;
            const match1 = s.match(/^(\d+)\.0+$/);
            if (match1) return String(parseInt(match1[1], 10));
            s = s.replace(/-/g, '');
            const match2 = s.match(/^(\d+)[A-Z]*$/);
            if (match2) return String(parseInt(match2[1], 10));
            return s;
        }

        function _fundo_to_aq(fundo) {
            if (!fundo) return null;
            const fundoUpper = String(fundo).toUpperCase().trim();
            const mapping = {
                'ARENA AZUL':   'AQ1',
                'QURI ALLPA':   'AQ1',
                'KAWSAY ALLPA': 'AQ1',
                'AYLLU ALLPA':  'AQ1',
                'SANTA TERESA': 'AQ2',
                'VIVADIS':      'AQ2',
                'AMPLIACION':   'AQ2',
            };
            return mapping[fundoUpper] || null;
        }

        // ============================================================
        // LOADING
        // ============================================================
        function showLoading(text = 'Procesando…') {
            const spinner = document.getElementById('loadingSpinner');
            if (spinner) {
                document.getElementById('loadingText').textContent = text;
                spinner.style.display = 'block';
            }
        }

        function hideLoading() {
            const spinner = document.getElementById('loadingSpinner');
            if (spinner) spinner.style.display = 'none';
        }

        // ============================================================
        // INTERPOLACIÓN IDW
        // ============================================================
        function interpolateIDW(x, y, points, values, power = 2) {
            if (points.length === 0) return 0;
            if (points.length === 1) return values[0];
            let totalWeight = 0, totalValue = 0;
            const distances = [];
            for (let i = 0; i < points.length; i++) {
                const [py, px] = points[i];
                const dist = Math.sqrt((x - px) ** 2 + (y - py) ** 2);
                distances.push(dist);
                if (dist < 1e-10) return values[i];
            }
            const minDist = Math.max(Math.min(...distances), 0.0001);
            for (let i = 0; i < points.length; i++) {
                const dist = Math.max(minDist / 100, distances[i]);
                const weight = 1 / (dist ** power);
                totalWeight += weight;
                totalValue += values[i] * weight;
            }
            return totalValue / totalWeight;
        }

        function createInterpolationGrid(lotes, bounds, gridSize = 50) {
            const [latMin, lonMin, latMax, lonMax] = bounds;
            const points = lotes.map(l => [l.lat, l.lon]);
            const values = lotes.map(l => l.capturas);
            const grid = [];
            for (let i = 0; i < gridSize; i++) {
                grid[i] = [];
                for (let j = 0; j < gridSize; j++) {
                    const lat = latMax - (i / gridSize) * (latMax - latMin);
                    const lon = lonMin + (j / gridSize) * (lonMax - lonMin);
                    grid[i][j] = interpolateIDW(lon, lat, points, values, 2);
                }
            }
            return grid;
        }

        function extractContoursMarching(grid, bounds, levels) {
            const [latMin, lonMin, latMax, lonMax] = bounds;
            const gridSize = grid.length;
            const contours = [];
            for (const level of levels) {
                const paths = [];
                for (let i = 0; i < gridSize - 1; i++) {
                    for (let j = 0; j < gridSize - 1; j++) {
                        const v00 = grid[i][j], v10 = grid[i+1][j];
                        const v01 = grid[i][j+1], v11 = grid[i+1][j+1];
                        const caseIdx = (v00>level?1:0)|(v10>level?2:0)|(v01>level?4:0)|(v11>level?8:0);
                        if (caseIdx === 0 || caseIdx === 15) continue;
                        const edges = [];
                        if ((v00>level) !== (v10>level)) { const t=Math.abs(level-v00)/Math.abs(v10-v00||1); edges.push([i+Math.max(0,Math.min(1,t)),j]); }
                        if ((v00>level) !== (v01>level)) { const t=Math.abs(level-v00)/Math.abs(v01-v00||1); edges.push([i,j+Math.max(0,Math.min(1,t))]); }
                        if ((v10>level) !== (v11>level)) { const t=Math.abs(level-v10)/Math.abs(v11-v10||1); edges.push([i+Math.max(0,Math.min(1,t)),j+1]); }
                        if ((v01>level) !== (v11>level)) { const t=Math.abs(level-v01)/Math.abs(v11-v01||1); edges.push([i+1,j+Math.max(0,Math.min(1,t))]); }
                        if (edges.length >= 2) {
                            const path = edges.map(([pi,pj]) => [
                                latMax-(pi/gridSize)*(latMax-latMin),
                                lonMin+(pj/gridSize)*(lonMax-lonMin)
                            ]);
                            paths.push(path);
                        }
                    }
                }
                if (paths.length > 0) contours.push({ level, paths });
            }
            return contours;
        }

        function douglasPeucker(points, epsilon) {
            if (points.length < 3) return points;
            let maxDist = 0, maxIdx = 0;
            const start = points[0], end = points[points.length-1];
            for (let i = 1; i < points.length-1; i++) {
                const dist = perpendicularDistance(points[i], start, end);
                if (dist > maxDist) { maxDist = dist; maxIdx = i; }
            }
            if (maxDist > epsilon) {
                const left  = douglasPeucker(points.slice(0, maxIdx+1), epsilon);
                const right = douglasPeucker(points.slice(maxIdx), epsilon);
                return [...left.slice(0,-1), ...right];
            } else return [start, end];
        }

        function perpendicularDistance(point, lineStart, lineEnd) {
            const [px,py]=[...point],[x1,y1]=[...lineStart],[x2,y2]=[...lineEnd];
            const num=Math.abs((y2-y1)*px-(x2-x1)*py+x2*y1-y2*x1);
            const den=Math.sqrt((y2-y1)**2+(x2-x1)**2);
            return den===0?0:num/den;
        }

        // ============================================================
        // CONTORNOS GAUSSIANOS
        // ============================================================
        function renderContornosGauss() {
            const contornos = streamlitData.contornos || { fills: [], lines: [], opacidad: 0.65 };
            const opacidad = contornos.opacidad ?? 0.65;
            if (isolineLayer) { map.removeLayer(isolineLayer); isolineLayer = null; }
            const fillLayer = L.featureGroup();
            const lineLayer = L.featureGroup();
            contornos.fills.forEach(f => {
                if (!f.coords || f.coords.length < 3) return;
                L.polygon(f.coords, {
                    color: f.color, fillColor: f.color,
                    fillOpacity: opacidad, weight: 1.5, opacity: 1, interactive: false,
                }).addTo(fillLayer);
            });
            contornos.lines.forEach(l => {
                if (!l.coords || l.coords.length < 2) return;
                L.polyline(l.coords, {
                    color: "rgba(38,50,56,0.7)", weight: l.grosor ?? 2,
                    opacity: 1, lineCap: "round", lineJoin: "round",
                }).bindPopup(`<b style="font-family:'Segoe UI',Arial;color:#263238;">Nivel: ${l.level.toFixed(1)} capturas</b>`)
                  .addTo(lineLayer);
            });
            isolineLayer = L.featureGroup([fillLayer, lineLayer]);
            isolineLayer.addTo(map);
            if (markerLayer) markerLayer.bringToFront();
        }

        // ============================================================
        // RENDERIZAR PUNTOS — badges estilo temperatura
        // ============================================================
        function renderPuntos() {
            const lotes    = streamlitData.lotes   || [];
            const lotesRaw = streamlitData.data    || [];

            if (markerLayer) { map.removeLayer(markerLayer); markerLayer = null; }

            const badgeLayer  = L.featureGroup();
            const circleLayer = L.featureGroup();

            // ── Helper: popup estilo temperatura ──
            function makePopup(d, lotesStr) {
                const color = getColorByCapturas(d.capturas);
                const fuente = d.con_punto_gps
                    ? "📍 GPS trampa (KMZ puntos)"
                    : d.con_kmz ? "🔷 Centroide lote (KMZ polígono)" : "📌 Coordenada Excel";
                return `
                    <div style="font-family:'Segoe UI',Arial,sans-serif;font-size:12px;
                                line-height:1.7;min-width:170px;color:#263238;">
                        <div style="font-weight:700;font-size:13px;margin-bottom:4px;
                                    color:#263238;">${d.fundo || ''}</div>
                        <div style="display:flex;gap:10px;margin-bottom:6px;">
                            <span><b>Módulo:</b> ${d.modulo || ''}</span>
                            <span><b>Turno:</b> ${d.turno || ''}</span>
                        </div>
                        ${lotesStr ? `<div><b>Lotes:</b> ${lotesStr}</div>` : ''}
                        <hr style="margin:6px 0;border:none;border-top:1px solid #ECEFF1;">
                        <div style="display:flex;align-items:center;gap:6px;">
                            <span style="width:10px;height:10px;border-radius:50%;
                                         background:${color};display:inline-block;
                                         border:1px solid rgba(0,0,0,0.15);"></span>
                            <b style="color:${d.capturas > 3 ? '#B71C1C' : '#263238'};">
                                ${d.capturas} capturas
                            </b>
                        </div>
                        <div style="font-size:10px;color:#78909C;margin-top:4px;">${fuente}</div>
                    </div>`;
            }

            // ── Helper: badge pill estilo temperatura ──
            function makeBadgeIcon(label, color, capturas, colorAcento, size='normal') {
                const esRojo  = capturas > 3;
                const bg      = esRojo ? '#B71C1C' : color;
                const txt     = capturas === 0 ? '#263238' : '#fff';
                const fs      = size === 'small' ? '10px' : '11px';
                const pad     = size === 'small' ? '2px 8px' : '3px 10px';
                const bLeft   = `border-left:4px solid ${colorAcento};`;
                return L.divIcon({
                    className: "turno-label",
                    html: `
                        <div style="
                            display:inline-flex;align-items:center;gap:5px;
                            background:rgba(255,255,255,0.92);
                            padding:${pad};
                            border-radius:14px;
                            ${bLeft}
                            box-shadow:0 2px 6px rgba(0,0,0,0.25);
                            font-family:'Segoe UI',Arial,sans-serif;
                            font-size:${fs};font-weight:700;
                            color:#263238;letter-spacing:0.02em;
                            white-space:nowrap;pointer-events:auto;
                        ">
                            <span style="width:8px;height:8px;border-radius:50%;
                                         background:${bg};display:inline-block;
                                         border:1px solid rgba(255,255,255,0.8);"></span>
                            ${label}
                            ${capturas > 0 ? `<span style="background:${bg};color:#fff;
                                border-radius:10px;padding:0 6px;font-size:${fs};
                                font-weight:900;">${capturas}</span>` : ''}
                        </div>`,
                    iconSize:    [100, 26],
                    iconAnchor:  [50, 13],
                    popupAnchor: [0, -16],
                });
            }

            // ── CAPA BADGES (zoom lejano) ──
            lotes.forEach(d => {
                const color      = getColorByCapturas(d.capturas);
                const colorAcento = getColorMod(d.modulo_n || _norm_mod(d.modulo));
                const esRojo     = d.capturas > 3;
                const turnoLabel = d.turno  ? d.turno.replace(/.*T\s*0*(\d+).*/i, 'T$1') : "";
                const modLabel   = d.modulo ? d.modulo.replace(/.*?(\d+).*/i, 'M$1')      : "";
                const lotesStr   = Array.isArray(d.lotes) && d.lotes.length > 0
                    ? d.lotes.join(", ") : (d.lote || "—");
                const popup = makePopup(d, lotesStr);

        const ZOOM_CIRCULOS = 16;

        function _actualizarCapasPorZoom() {
            if (!window._badgeLayer || !window._circleLayer) return;
            const trampasVisible = window._trampasVisible !== false;
            if (!trampasVisible) return;
            const z = map.getZoom();
            if (z >= ZOOM_CIRCULOS) {
                if (map.hasLayer(window._badgeLayer))   map.removeLayer(window._badgeLayer);
                if (!map.hasLayer(window._circleLayer)) window._circleLayer.addTo(map);
            } else {
                if (map.hasLayer(window._circleLayer))  map.removeLayer(window._circleLayer);
                if (!map.hasLayer(window._badgeLayer))  window._badgeLayer.addTo(map);
            }
            const etiquetasVisible = window._etiquetasVisible !== false;
            if (!etiquetasVisible) {
                [window._badgeLayer, window._circleLayer].forEach(layer => {
                    if (!layer) return;
                    layer.eachLayer(function(marker) {
                        const icon = marker.options?.icon?.options?.html || "";
                        if (!icon.includes("background:#B71C1C")) {
                            const el = marker.getElement();
                            if (el) el.style.visibility = "hidden";
                        }
                    });
                });
            }
        }

        // ============================================================
        // PANEL DE ALERTAS
        // ============================================================
        function renderAlertPanel() {
            const lotes = streamlitData.lotes || [];
            const panel = document.getElementById('alertPanel');
            if (!panel) return;
            const alertas = lotes.filter(d => d.capturas > 3);
            if (alertas.length === 0) { panel.style.display = 'none'; return; }

            const porFundo = {};
            alertas.forEach(d => {
                const fundo = d.fundo || "—";
                if (!porFundo[fundo]) porFundo[fundo] = [];
                porFundo[fundo].push(d);
            });
            Object.keys(porFundo).forEach(f => porFundo[f].sort((a,b) => b.capturas - a.capturas));
            const fundosOrdenados = Object.keys(porFundo).sort((a,b) => {
                return porFundo[b].reduce((s,d)=>s+d.capturas,0) - porFundo[a].reduce((s,d)=>s+d.capturas,0);
            });
            const maxCap = Math.max(...alertas.map(d => d.capturas));

            let html = `
                <div class="alert-panel-title">🔴 Alertas Fundo / Turno</div>
                <div class="alert-panel-sub">Capturas &gt; 3 · mayor a menor</div>`;

            fundosOrdenados.forEach(fundo => {
                const items = porFundo[fundo];
                const total = items.reduce((s,d)=>s+d.capturas,0);
                html += `
                    <div class="alert-fundo">
                        <span>📍 ${fundo}</span>
                        <span class="alert-fundo-total">${total} 🪰</span>
                    </div>`;
                items.forEach(d => {
                    const modLabel   = d.modulo ? d.modulo.replace(/.*?(\d+).*/i, 'M$1') : "";
                    const turnoLabel = d.turno  ? d.turno.replace(/.*T\s*0*(\d+).*/i, 'T$1') : "";
                    const pct = Math.round((d.capturas / maxCap) * 100);
                    html += `
                        <div class="alert-row">
                            <span class="alert-turno">${modLabel}-${turnoLabel}</span>
                            <span class="alert-cap">${d.capturas} 🪰</span>
                        </div>
                        <div class="alert-bar" style="width:${pct}%;"></div>`;
                });
            });

            panel.innerHTML = html;
            panel.style.display = 'block';
        }

        function renderEspectral() {

            if (isolineLayer) { map.removeLayer(isolineLayer); isolineLayer = null; }

        // ============================================================
        // VECTORES
        // ============================================================
        function renderVectores() {
            const cfg     = streamlitData.config || {};
            const rawData = streamlitData.data   || [];
            const lotes   = rawData.filter(d =>
                d.con_kmz === true && isFinite(d.lat) && isFinite(d.lon) &&
                d.lat !== -9999 && d.lon !== -9999
            );
            if (!cfg.mostrar_vectores || lotes.length < 3) return;

            const nArrows     = cfg.n_arrows    || 15;
            const escala      = (cfg.escala_flecha || 6) * 1e-4;
            const hsDeg       = (cfg.head_size   || 6) * 1e-5;
            const minMag      = cfg.min_mag      || 0.05;
            const colorFlecha = cfg.color_flechas || "#00838F"; // cyan temperatura

            if (!window._vectorLayer) window._vectorLayer = L.featureGroup();
            else window._vectorLayer.clearLayers();

            const lats = lotes.map(d=>d.lat), lons = lotes.map(d=>d.lon);
            const latMin=Math.min(...lats), latMax=Math.max(...lats);
            const lonMin=Math.min(...lons), lonMax=Math.max(...lons);
            if (latMax-latMin < 1e-8 || lonMax-lonMin < 1e-8) return;

            const GRID=60, gridZ=[], gridLat=[], gridLon=[];
            for (let i=0;i<GRID;i++) {
                gridZ[i]=[]; gridLat[i]=[]; gridLon[i]=[];
                for (let j=0;j<GRID;j++) {
                    const lat=latMin+(i/(GRID-1))*(latMax-latMin);
                    const lon=lonMin+(j/(GRID-1))*(lonMax-lonMin);
                    gridLat[i][j]=lat; gridLon[i][j]=lon;
                    gridZ[i][j]=idwInterp(lat,lon,lotes,2);
                }
            }
            const gridSmooth = gaussianBlur2D(gridZ, GRID, GRID, 4);
            const gradY=[],gradX=[];
            for (let i=0;i<GRID;i++) {
                gradY[i]=[]; gradX[i]=[];
                for (let j=0;j<GRID;j++) {
                    const i0=Math.max(0,i-1),i1=Math.min(GRID-1,i+1);
                    const j0=Math.max(0,j-1),j1=Math.min(GRID-1,j+1);
                    gradY[i][j]=(gridSmooth[i1][j]-gridSmooth[i0][j])/(i1-i0);
                    gradX[i][j]=(gridSmooth[i][j1]-gridSmooth[i][j0])/(j1-j0);
                }
            }
            const step=Math.max(1,Math.floor(GRID/nArrows));
            const vectors=[];
            for (let i=Math.floor(step/2);i<GRID;i+=step) {
                for (let j=Math.floor(step/2);j<GRID;j+=step) {
                    const val=gridSmooth[i][j],gy=gradY[i][j],gx=gradX[i][j];
                    if (!isFinite(val)||!isFinite(gy)||!isFinite(gx)) continue;
                    const mag=Math.sqrt(gy*gy+gx*gx);
                    if (mag<minMag||!isFinite(mag)||mag===0) continue;
                    vectors.push({lat:gridLat[i][j],lon:gridLon[i][j],
                                  dlat:gy/mag,dlon:gx/mag,magnitude:mag,density:val});
                }
            }
            if (vectors.length===0) return;
            const magMax=Math.max(...vectors.map(v=>v.magnitude).filter(isFinite))||1;
            vectors.forEach(v => {
                const magNorm=Math.min(1,Math.max(0,v.magnitude/magMax));
                const arrowLen=escala*(0.3+0.7*magNorm);
                const opacity=0.45+0.55*magNorm;
                const weight=1+Math.round(magNorm*3);
                const lat0=v.lat,lon0=v.lon,lat1=lat0+v.dlat*arrowLen,lon1=lon0+v.dlon*arrowLen;
                L.polyline([[lat0,lon0],[lat1,lon1]],{
                    color:colorFlecha,weight,opacity
                }).addTo(window._vectorLayer);
                const hs=hsDeg*10*(0.6+0.4*magNorm);
                const angle=Math.atan2(v.dlat,v.dlon);
                const leftA=angle+(155*Math.PI/180),rightA=angle-(155*Math.PI/180);
                L.polygon([
                    [lat1,lon1],
                    [lat1+hs*Math.sin(leftA),lon1+hs*Math.cos(leftA)],
                    [lat1+hs*Math.sin(rightA),lon1+hs*Math.cos(rightA)],
                ],{color:colorFlecha,fillColor:colorFlecha,fillOpacity:opacity,weight:0})
                 .addTo(window._vectorLayer);
            });
            window._vectorLayer.addTo(map);
        }

        function idwInterp(lat,lon,points,power) {
            let num=0,den=0;
            for (const p of points) {
                const d2=(lat-p.lat)**2+(lon-p.lon)**2;
                if (d2<1e-12) return p.capturas;
                const w=1/Math.pow(d2,power/2);
                num+=w*p.capturas; den+=w;
            }
            return den>0?num/den:0;
        }

        function gaussianBlur2D(grid,rows,cols,sigma) {
            const radius=Math.ceil(sigma*3);
            const kernel=[]; let ksum=0;
            for (let k=-radius;k<=radius;k++){const v=Math.exp(-(k*k)/(2*sigma*sigma));kernel.push(v);ksum+=v;}
            for (let k=0;k<kernel.length;k++) kernel[k]/=ksum;
            const tmp=Array.from({length:rows},()=>new Array(cols).fill(0));
            for (let i=0;i<rows;i++) for (let j=0;j<cols;j++) {
                let acc=0;
                for (let k=0;k<kernel.length;k++){const jj=Math.min(cols-1,Math.max(0,j+k-radius));acc+=kernel[k]*grid[i][jj];}
                tmp[i][j]=acc;
            }
            const out=Array.from({length:rows},()=>new Array(cols).fill(0));
            for (let i=0;i<rows;i++) for (let j=0;j<cols;j++) {
                let acc=0;
                for (let k=0;k<kernel.length;k++){const ii=Math.min(rows-1,Math.max(0,i+k-radius));acc+=kernel[k]*tmp[ii][j];}
                out[i][j]=acc;
            }
            return out;
        }

        // ============================================================
        // POLÍGONOS KMZ — borde blanco estilo temperatura
        // ============================================================
        function renderPolygons(polygons) {
            const polygsNormalized = polygons.map(poly => ({
                ...poly,
                mod_n:     poly.mod_n     !== undefined ? poly.mod_n     : null,
                tur_n:     poly.tur_n     !== undefined ? poly.tur_n     : null,
                fundo_aq:  poly.fundo_aq  !== undefined ? poly.fundo_aq  : null,
                lote_name: poly.lote || poly.lote_name || null
            }));

            allPolygons   = polygsNormalized;
            let bounds    = L.latLngBounds();
            polygonLayer  = L.featureGroup();

            polygsNormalized.forEach(poly => {
                try {
                    if (!poly.coords || poly.coords.length < 3) return;
                    poly.coords.forEach(c => bounds.extend(c));
                    const color = getColorMod(poly.mod_n);
                    // Borde blanco + trazo de color acento — igual que temperatura
                    L.polygon(poly.coords, {
                        color:       'white',
                        weight:      2.5,
                        opacity:     0.9,
                        fillColor:   color,
                        fillOpacity: 0,      // sin relleno, solo borde
                        interactive: false,
                    }).addTo(polygonLayer);
                    // Borde interior de color módulo (efecto doble borde como temperatura)
                    L.polygon(poly.coords, {
                        color:       color,
                        weight:      1,
                        opacity:     0.6,
                        fillOpacity: 0,
                        interactive: false,
                        dashArray:   null,
                    }).addTo(polygonLayer);
                } catch (e) {
                    console.error('Error en polígono:', e);
                }
            });

            polygonLayer.addTo(map);
            return bounds;
        }

        // ============================================================
        // CONTROL DE CAPAS
        // ============================================================
        // ── Clave de sessionStorage para el estado de capas ──
        const LAYER_STATE_KEY = 'mapa_mosca_layers';

        function _saveLayerState() {
            const state = {
                trampas:   document.getElementById('chk_trampas').checked,
                etiquetas: document.getElementById('chk_etiquetas').checked,
                alertas:   document.getElementById('chk_alertas').checked,
                vectores:  document.getElementById('chk_vectores').checked,
                curvas:    document.getElementById('chk_curvas').checked,
            };
            try { sessionStorage.setItem(LAYER_STATE_KEY, JSON.stringify(state)); } catch(e) {}
        }

        function _loadLayerState() {
            try {
                const raw = sessionStorage.getItem(LAYER_STATE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch(e) { return null; }
        }

        // Aplica el estado guardado a los checkboxes (sin disparar eventos)
        function _applyLayerState(state) {
            if (!state) return;
            ['trampas','etiquetas','alertas','vectores','curvas'].forEach(id => {
                const el = document.getElementById('chk_' + id);
                if (el && state[id] !== undefined) el.checked = state[id];
            });
        }

        // Aplica el estado guardado al mapa (capas visibles/ocultas)
        function _applyLayerStateToMap(state) {
            if (!state) return;

            // ── trampas ──
            window._trampasVisible = state.trampas;
            if (!state.trampas) {
                if (window._badgeLayer  && map.hasLayer(window._badgeLayer))  map.removeLayer(window._badgeLayer);
                if (window._circleLayer && map.hasLayer(window._circleLayer)) map.removeLayer(window._circleLayer);
            }

            // ── etiquetas no rojas ──
            window._etiquetasVisible = state.etiquetas;
            if (!state.etiquetas) {
                [window._badgeLayer, window._circleLayer].forEach(layer => {
                    if (!layer) return;
                    layer.eachLayer(function(lyr) {
                        const icon = lyr.options?.icon?.options?.html || "";
                        if (!icon.includes("background:#B71C1C")) {
                            const el = lyr.getElement();
                            if (el) el.style.visibility = "hidden";
                        }
                    });
                });
            }

            // ── panel alertas ──
            const alertPanel = document.getElementById('alertPanel');
            if (alertPanel) alertPanel.style.display = state.alertas ? 'block' : 'none';

            // ── vectores ──
            if (window._vectorLayer) {
                if (state.vectores) window._vectorLayer.addTo(map);
                else if (map.hasLayer(window._vectorLayer)) map.removeLayer(window._vectorLayer);
            }

            // ── curvas de nivel ──
            if (!state.curvas && isolineLayer) {
                isolineLayer.eachLayer(layer => {
                    if (layer instanceof L.FeatureGroup) {
                        layer.eachLayer(sub => {
                            if (sub instanceof L.Polyline && !(sub instanceof L.Polygon)) {
                                sub.setStyle({ opacity: 0 });
                            }
                        });
                    }
                });
            }
        }

        function initLayerControls() {
            const cfg  = streamlitData.config || {};
            const modo = cfg.modo_color || "Normal";

            document.getElementById('item_curvas').style.display   = modo === "Curvas de Nivel" ? 'flex' : 'none';
            document.getElementById('item_vectores').style.display = cfg.mostrar_vectores       ? 'flex' : 'none';

            // ── Restaurar estado guardado ──
            const savedState = _loadLayerState();
            if (savedState) {
                _applyLayerState(savedState);
                // Aplicar al mapa en el siguiente tick (capas ya renderizadas)
                setTimeout(() => _applyLayerStateToMap(savedState), 50);
            }

            // ── Listeners: guardar estado en cada cambio ──
            document.getElementById('chk_trampas').addEventListener('change', function () {
                window._trampasVisible = this.checked;
                if (this.checked) _actualizarCapasPorZoom();
                else {
                    if (window._badgeLayer  && map.hasLayer(window._badgeLayer))  map.removeLayer(window._badgeLayer);
                    if (window._circleLayer && map.hasLayer(window._circleLayer)) map.removeLayer(window._circleLayer);
                }
                _saveLayerState();
            });

            document.getElementById('chk_etiquetas').addEventListener('change', function () {
                window._etiquetasVisible = this.checked;
                [window._badgeLayer, window._circleLayer].forEach(layer => {
                    if (!layer) return;
                    layer.eachLayer(function(lyr) {
                        const icon = lyr.options?.icon?.options?.html || "";
                        if (!icon.includes("background:#B71C1C")) {
                            const el = lyr.getElement();
                            if (el) el.style.visibility = window._etiquetasVisible ? "visible" : "hidden";
                        }
                    });
                });
                _saveLayerState();
            });

            document.getElementById('chk_alertas').addEventListener('change', function () {
                const alertPanel = document.getElementById('alertPanel');
                if (alertPanel) alertPanel.style.display = this.checked ? 'block' : 'none';
                _saveLayerState();
            });

            document.getElementById('chk_vectores').addEventListener('change', function () {
                if (!window._vectorLayer) return;
                this.checked ? window._vectorLayer.addTo(map) : map.removeLayer(window._vectorLayer);
                _saveLayerState();
            });

            document.getElementById('chk_curvas').addEventListener('change', function () {
                if (!isolineLayer) return;
                isolineLayer.eachLayer(layer => {
                    if (layer instanceof L.FeatureGroup) {
                        layer.eachLayer(sub => {
                            if (sub instanceof L.Polyline && !(sub instanceof L.Polygon)) {
                                sub.setStyle({ opacity: this.checked ? 1 : 0 });
                            }
                        });
                    }
                });
                _saveLayerState();
            });
        }

        // ============================================================
        // MODO PNG
        // ============================================================
        function _prepararModoPNG() {
            modoSoloAlertas = true;
            if (window._badgeLayer)  { map.removeLayer(window._badgeLayer);  window._badgeLayer  = null; }
            if (window._circleLayer) { map.removeLayer(window._circleLayer); window._circleLayer = null; }
            renderPuntos();
            const panel  = document.getElementById('layerControlPanel');
            const info   = document.querySelector('.map-info');
            const alert  = document.getElementById('alertPanel');
            const legend = document.getElementById('legendContainer');
            if (panel)  panel.style.display  = 'none';
            if (info)   info.style.display   = 'none';
            if (alert)  alert.style.display  = 'none';
            if (legend) legend.style.display = 'block';
        }

        function activarModoPNGGeneral() {
            _prepararModoPNG();
            const bounds = L.latLngBounds();
            (streamlitData.lotes || []).forEach(d => {
                if (d.lat && d.lon && d.lat !== -9999 && d.lon !== -9999) bounds.extend([d.lat, d.lon]);
            });
            if (!bounds.isValid()) {
                (streamlitData.data || []).forEach(d => {
                    if (d.lat && d.lon && d.lat !== -9999 && d.lon !== -9999) bounds.extend([d.lat, d.lon]);
                });
            }
            if (!bounds.isValid() && polygonLayer) {
                const b = polygonLayer.getBounds();
                if (b.isValid()) bounds.extend(b);
            }
            if (bounds.isValid()) map.fitBounds(bounds, { padding: [50, 50], maxZoom: 14, animate: false });
            return true;
        }

        function desactivarModoPNG() {
            modoSoloAlertas = false;
            if (window._badgeLayer)  { map.removeLayer(window._badgeLayer);  window._badgeLayer  = null; }
            if (window._circleLayer) { map.removeLayer(window._circleLayer); window._circleLayer = null; }
            renderPuntos();
            const panel  = document.getElementById('layerControlPanel');
            const alert  = document.getElementById('alertPanel');
            const info   = document.querySelector('.map-info');
            const legend = document.getElementById('legendContainer');
            if (panel)  panel.style.display  = 'block';
            if (alert)  alert.style.display  = 'block';
            if (info)   info.style.display   = 'block';
            if (legend) legend.style.display = 'block';
        }

        // ============================================================
        // INICIALIZAR MAPA
        // ============================================================
        async function initMap() {
            if (polygonLayer) { polygonLayer.clearLayers(); polygonLayer = null; }
            if (markerLayer)  { markerLayer.clearLayers();  markerLayer  = null; }
            if (isolineLayer) { map && map.removeLayer(isolineLayer); isolineLayer = null; }
            if (map)          { map.off(); map.remove(); map = null; }

            const container = document.getElementById('mapContainer');
            if (!container) { console.error('❌ mapContainer no encontrado'); return; }

            map = L.map('mapContainer', {
                attributionControl: true,
                zoomControl:        true,
                zoomAnimation:      false,
                fadeAnimation:      false,
                markerZoomAnimation:false
            }).setView([-8.345, -79.160], 13);
            window.map = map;

            // ── Tile satellite Esri igual que temperatura ──
            L.tileLayer(
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                { attribution: 'Esri WorldImagery', maxZoom: 19, minZoom: 10 }
            ).addTo(map);

            // ── Capa de etiquetas/referencias encima (igual que temperatura) ──
            L.tileLayer(
                'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
                { attribution: 'Esri Labels', opacity: 0.7 }
            ).addTo(map);

            map.whenReady(() => { setTimeout(() => map.invalidateSize(true), 500); });
            L.control.scale({ position: 'bottomright' }).addTo(map);

            try {
                const polygons = streamlitData.polygons || [];
                if (polygons.length > 0) {
                    const bounds = renderPolygons(polygons);
                    if (bounds && bounds.isValid()) {
                        setTimeout(() => map.fitBounds(bounds, { padding: [40, 40] }), 300);
                    }
                }

                await new Promise(r => setTimeout(r, 10));

                const modo = streamlitData.config?.modo_color || "Normal";

                if (modo === "Normal") {
                    renderPuntos();
                    map.on('zoomend', _actualizarCapasPorZoom);
                } else if (modo === "Espectral") {
                    renderEspectral();
                    renderPuntos();
                    map.on('zoomend', _actualizarCapasPorZoom);
                } else if (modo === "Curvas de Nivel") {
                    renderContornosGauss();
                    renderPuntos();
                    map.on('zoomend', _actualizarCapasPorZoom);
                }

                renderVectores();
                if (markerLayer) markerLayer.bringToFront();

                updateLegend();

                document.getElementById('recordCount').textContent = streamlitData.recordCount || 0;
                document.getElementById('modoInfo').textContent =
                    modo === "Normal"         ? "⬤ Puntos por lote" :
                    modo === "Espectral"      ? "🌈 Espectral + Puntos" :
                                               "➖ Curvas de nivel + Puntos";

                renderAlertPanel();
                initLayerControls();
                hideLoading();

            } catch (error) {
                console.error('❌ Error en initMap:', error);
                hideLoading();
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => initMap());
        } else {
            initMap();
        }

    </script>

</body>
</html>
